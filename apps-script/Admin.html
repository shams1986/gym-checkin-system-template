<!doctype html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>Gym Check-in Admin</title>
  <style><?!= includeAdminFile_("Admin.css"); ?></style>
  <style>.row-error{color:var(--danger);font-size:12px;margin-top:6px;max-width:320px}.form-success{color:var(--success);min-height:1.4em;font-weight:700}.page-header{margin-bottom:14px}.page-header h1{font-size:26px}.page-header p,.page-helper{color:var(--muted);margin:3px 0 14px}.button,.row-actions button{transition:transform .12s ease,box-shadow .12s ease,background .12s ease}.button:hover:not(:disabled),.row-actions button:hover:not(:disabled){filter:brightness(.96);box-shadow:0 3px 10px #102a341c}.button:active:not(:disabled),.row-actions button:active:not(:disabled){transform:translateY(2px) scale(.98);box-shadow:none}.button.is-busy,.row-actions button.is-busy{display:inline-flex;align-items:center;justify-content:center;gap:8px;opacity:.85}.button-spinner{width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:button-spin .7s linear infinite}.is-success{background:#15803d!important;color:#fff!important}.is-error{background:#b42318!important;color:#fff!important}@keyframes button-spin{to{transform:rotate(360deg)}}.table-time{display:block;color:var(--muted);margin-top:2px}.report-metrics{grid-template-columns:repeat(2,minmax(0,220px))}.report-filters label{display:grid;gap:5px}.report-filters label span{font-size:12px;font-weight:750;color:var(--muted)}.compact-filters{grid-template-columns:minmax(220px,360px) auto}.member-search-field{position:relative}.autocomplete-results{position:absolute;z-index:8;top:76px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px #102a3426;max-height:240px;overflow:auto}.autocomplete-option{display:block;width:100%;border:0;border-bottom:1px solid var(--line);padding:11px 12px;background:#fff;text-align:left;cursor:pointer}.autocomplete-option:hover{background:#edf2f3}.autocomplete-empty{padding:12px;color:var(--muted)}</style>
  <style>[hidden]{display:none!important}.app-shell main{padding-top:22px}.attendance-filters{grid-template-columns:repeat(6,minmax(120px,1fr)) auto}.attendance-filters label{display:grid;gap:5px}.attendance-filters label span{font-size:12px;font-weight:750;color:var(--muted)}.attendance-filters>button{align-self:end}@media(max-width:1200px){.attendance-filters{grid-template-columns:repeat(3,minmax(140px,1fr))}}@media(max-width:600px){.attendance-filters{grid-template-columns:1fr}}</style>
</head>
<body>
  <div id="auth-view" class="auth-shell">
    <section class="auth-card">
      <div class="brand-mark">GC</div>
      <p class="eyebrow">Owner workspace</p>
      <h1>Gym Check-in Admin</h1>
      <p>Checking your authorized Google account…</p>
      <p id="auth-error" class="form-error" role="alert"></p>
    </section>
  </div>

  <div id="admin-shell" class="app-shell" hidden>
    <aside class="sidebar">
      <a class="wordmark" href="#dashboard"><span class="brand-mark small">GC</span><span id="gym-short-name">Gym Admin</span></a>
      <nav aria-label="Admin navigation">
        <button data-route="dashboard" class="nav-link active">Dashboard</button>
        <button data-route="members" class="nav-link">Members</button>
        <button data-route="attendance" class="nav-link">Attendance</button>
        <button data-route="reports" class="nav-link">Reports</button>
        <button data-route="cards" class="nav-link">QR Cards</button>
        <button data-route="schedule" class="nav-link">Schedule</button>
        <button data-route="personal-messages" class="nav-link">Personal Messages</button>
      </nav>
      <div class="sidebar-footer"><span id="admin-email"></span></div>
    </aside>
    <main>
      <header class="mobile-header"><button id="menu-toggle" aria-label="Toggle navigation">Menu</button><strong id="mobile-title">Dashboard</strong></header>
      <div id="notice" class="notice" hidden role="status"></div>
      <section id="view" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="editor-dialog">
    <form id="editor-form" method="dialog">
      <header><div><p class="eyebrow" id="editor-eyebrow"></p><h2 id="editor-title"></h2></div><button type="button" data-dialog-close class="icon-button" aria-label="Close">×</button></header>
      <div id="editor-error" class="form-error" role="alert"></div>
      <div id="editor-fields" class="form-grid"></div>
      <footer><button type="button" data-dialog-close class="button secondary">Cancel</button><button id="editor-save" value="default" class="button secondary">Save</button><button id="editor-secondary-action" type="button" class="button primary" hidden>Save and generate card</button></footer>
    </form>
  </dialog>

  <script><?!= includeAdminScript_("Admin.js"); ?></script>
</body>
</html>
